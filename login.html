<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - ITS Alumni & Stages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <h1>Connexion Admin</h1>
      <p>Accès réservé à l’administrateur du site.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Identifiant</label>
          <input type="text" id="username" required placeholder="Identifiant admin">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="Mot de passe">
        </div>

        <p id="loginError" style="color:red; display:none;">
          Identifiant ou mot de passe incorrect.
        </p>

        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>

      <p style="margin-top: 1rem;">
        <a href="index.html">← Retour au site</a>
      </p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
